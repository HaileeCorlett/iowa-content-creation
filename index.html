<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartland Behind The Lens | Iowa Wedding Content Creator</title>
    <style>
        :root {
            --primary: #8B5E66;
            --primary-light: #F9F3F4;
            --accent: #D4A373;
            --text-dark: #2B2D42;
            --text-muted: #5C5F73;
            --white: #FFFFFF;
            --border: #E5D9DC;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-dark);
            background-color: #FAFAFA;
            line-height: 1.6;
        }

        .disclaimer-banner {
            background-color: #222222;
            color: #FFFFFF;
            text-align: center;
            padding: 10px 15px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 20px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .site-title {
            font-size: 1.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 12px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav a {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }

        nav a:hover, nav a.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .hero {
            background-color: var(--primary-light);
            border-radius: 12px;
            padding: 45px 25px;
            text-align: center;
            margin-bottom: 35px;
            border: 1px solid var(--border);
        }

        .hero h1 {
            color: var(--primary);
            font-size: 2.3rem;
            margin-bottom: 15px;
            line-height: 1.25;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 680px;
            margin: 0 auto 25px auto;
        }

        .cta-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-btn {
            display: inline-block;
            background-color: var(--primary);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }

        .cta-btn:hover {
            background-color: #724B52;
        }

        .cta-btn-outline {
            display: inline-block;
            background-color: transparent;
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid var(--primary);
        }

        .cta-btn-outline:hover {
            background-color: var(--primary-light);
        }

        .section-heading {
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .bio-section {
            background-color: var(--white);
            border-radius: 8px;
            padding: 30px;
            border: 1px solid var(--border);
            margin-bottom: 35px;
        }

        .bio-section h2 {
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 35px;
        }
